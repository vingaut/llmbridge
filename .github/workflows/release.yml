name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            artifact: LLMBridge.exe
            ext: .exe
          - os: ubuntu-latest
            name: linux-x64
            artifact: LLMBridge
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10"

      - name: Build
        run: pyinstaller --clean --noconfirm llm-bridge.spec

      # Le nom de l'asset porte la version du tag : LLMBridge-v3.3.0-windows-x64.exe
      - name: Rename asset with version
        id: pack
        shell: bash
        run: |
          name="LLMBridge-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.ext }}"
          cp "dist/${{ matrix.artifact }}" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "dist/$name"

      # Archive des sources versionnée elle aussi (en plus du zip automatique de GitHub)
      - name: Source archive (versioned)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git archive --format=zip --prefix="LLMBridge-${GITHUB_REF_NAME}/" \
            -o "dist/LLMBridge-${GITHUB_REF_NAME}-source.zip" HEAD

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.pack.outputs.name }}
          generate_release_notes: true
          body_path: CHANGELOG.md

      - name: Upload source archive to release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LLMBridge-${{ github.ref_name }}-source.zip
