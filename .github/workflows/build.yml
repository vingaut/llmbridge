name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            artifact: LLMBridge.exe
          - os: ubuntu-latest
            name: linux-x64
            artifact: LLMBridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10"

      - name: Build single-file executable
        run: pyinstaller --clean --noconfirm llm-bridge.spec

      - name: Smoke test (--list)
        run: ./dist/${{ matrix.artifact }} --list

      - uses: actions/upload-artifact@v4
        with:
          name: LLMBridge-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
